<body class="sarter-page-page">

  <header id="header" class="header d-flex align-items-center sticky-top">
    <div class="container-fluid container-xl position-relative d-flex align-items-center">

      <a href="index.html" class="logo d-flex align-items-center me-auto">
        <h1 class="sitename">eCoTech</h1>
      </a>

      <nav id="navmenu" class="navmenu">
        <ul>
          <li><a href="index.html">Ana Sayfa</a></li>
          <li><a href="index.html#about">Hakkında</a></li>
          <li><a href="index.html#services">Hizmetler</a></li>
        </ul>
        <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
      </nav>

      <a class="btn-getstarted" href="login.html">Giriş Yap!</a>

    </div>
  </header>

  <main class="main">
    
    <!-- Starter Section Section -->
    <section id="starter-section" class="starter-section section">

      <!-- Section Title -->
      <div class="container section-title" data-aos="fade-up">
        <span>Kayıt Ol!</span>
        <h2>Kayıt Ol!</h2>
      </div><!-- End Section Title -->

      <form class="login-form" id="loginForm" method="POST" action="login.html" data-aos="fade-up">
        <input type="text" name="kullanici_adi" placeholder="Kullanıcı Adı:" required="">
        <input type="text" name="isim" placeholder="İsim:" required="">
        <input type="text" name="soyisim" placeholder="Soyisim:" required="">
        <input type="date" name="dogum_tarihi" placeholder="Doğum Tarihi:" id="dogumTarihi" required="" min="1900-01-01">
        <input type="email" name="email" placeholder="E-posta:" required="">
        <input type="tel" id="telefon" name="telefon" placeholder="Telefon Numarası: 5*********" required=""
          pattern="[0-9]{10}" maxlength="10">
        <p id="telefonUyari" class="uyari"></p>
        <input type="password" name="sifre" placeholder="Şifre:" required="" id="sifreInput">
        <p id="sifreUyari" class="uyari"></p>
        <input type="password" name="sifreTekrar" placeholder="Aynı Şifre:" required="" id="sifreTekrarInput">
        <p id="sifreTekrarUyari" class="uyari"></p>
        <button type="submit">Kayıt Ol</button>
        <div class="links">
          <a href="login.html">Hesabın var mı?</a>
        </div>
      </form>

    </section><!-- /Starter Section Section -->

  </main>

  
  <!-- Scroll Top -->
  <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <script src="assets/vendor/isotope-layout/isotope.pkgd.min.js"></script>
  <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
